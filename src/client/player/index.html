<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nailong Battle!</title>
  <meta name="description" content="Multiplayer motion-controlled saber duel game with 3D combat, physics, mobile phone controller, and solo practice mode.">
  <meta property="og:title" content="Nailong Battle!">
  <meta property="og:description" content="Multiplayer motion-controlled saber duel game with 3D combat, physics, mobile phone controller, and solo practice mode.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="lobby" class="screen menu-screen active">
    <h1 class="game-title">Nailong Battle!</h1>
    <div class="menu-card">
      <p id="lobby-status">Connecting...</p>
      <canvas id="qr-canvas"></canvas>
      <p id="lobby-url"></p>
      <p id="controller-status"></p>
      <button id="btn-solo-lobby">Play Solo vs Bot (Mouse &amp; Keyboard)</button>
    </div>
  </div>

  <div id="class-select-screen" class="screen menu-screen">
    <h1 class="game-title">Nailong Battle!</h1>
    <div class="menu-card">
      <h2>Waiting for class selection on your phone</h2>
      <p id="class-info">—</p>
      <p id="opponent-status">Waiting for opponent...</p>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="hud" style="display:none">
    <div id="hud-left">
      <span id="hud-p1-score">0</span>
    </div>
    <div id="hud-center">
      <span id="hud-round"></span>
    </div>
    <div id="hud-right">
      <span id="hud-p2-score">0</span>
    </div>
  </div>

  <div id="ability-callout"></div>

  <div id="smash">SMASH!</div>

  <div id="combo"><span id="combo-count">0</span> COMBO</div>

  <div id="power">
    <svg id="power-icon" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <path id="power-bolt" d="M13.5 1.5 4 13.5h6.5L9 22.5l10-12.5h-6.5z" />
        <clipPath id="power-clip"><rect id="power-level" x="0" y="22.5" width="24" height="0" /></clipPath>
        <linearGradient id="power-grad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#ff9a1a" />
          <stop offset="1" stop-color="#ffe26a" />
        </linearGradient>
      </defs>
      <use href="#power-bolt" class="power-empty" />
      <use href="#power-bolt" class="power-full" clip-path="url(#power-clip)" />
      <use href="#power-bolt" class="power-outline" />
    </svg>
  </div>

  <div id="overlay" style="display:none">
    <div id="overlay-content">
      <div id="overlay-badge" style="display:none"></div>
      <h1 id="overlay-title"></h1>
      <p id="overlay-subtitle"></p>
      <div id="overlay-score" style="display:none"></div>
      <button id="overlay-btn" style="display:none">Rematch</button>
    </div>
  </div>

  <div id="debug-bar" style="display:none">
    <span id="dbg-info">Debug: mouse=sword, space=block, E=power</span>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
